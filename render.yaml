services:
  - type: web
    name: zesthr-django
    runtime: python
    plan: free

    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput

    preDeployCommand: |
      python manage.py migrate --noinput

    startCommand: |
      gunicorn payroll_project.wsgi:application

    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0

      - key: DJANGO_SETTINGS_MODULE
        value: payroll_project.settings.production

      - key: DJANGO_DEBUG
        value: "False"

      - key: DJANGO_SSL_REDIRECT
        value: "True"

      - key: DJANGO_TRUST_PROXY_SSL_HEADER
        value: "True"

      - key: DB_SSLMODE
        value: require

      - key: DB_POOLED
        value: "False"

      - key: DB_DISABLE_SERVER_SIDE_CURSORS
        value: "False"

      - key: DB_CONNECT_TIMEOUT
        value: "10"

      - key: DB_CONN_MAX_AGE
        value: "60"

      - key: DJANGO_HSTS_SECONDS
        value: "0"

      - key: DJANGO_HSTS_INCLUDE_SUBDOMAINS
        value: "False"

      - key: DJANGO_HSTS_PRELOAD
        value: "False"

      - key: DJANGO_LOG_LEVEL
        value: INFO

      - key: DATABASE_URL
        sync: false

      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DJANGO_ALLOWED_HOSTS
        sync: false

      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false

      - key: DJANGO_EMAIL_HOST
        sync: false

      - key: DJANGO_EMAIL_PORT
        value: "587"

      - key: DJANGO_EMAIL_HOST_USER
        sync: false

      - key: DJANGO_EMAIL_HOST_PASSWORD
        sync: false

      - key: DJANGO_EMAIL_USE_TLS
        value: "True"

      - key: DJANGO_DEFAULT_FROM_EMAIL
        sync: false